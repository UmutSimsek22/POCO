name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: 📥 Repo Checkout
        uses: actions/checkout@v4

      - name: 🟢 Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Java 17 Kurulumu
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Bağımlılıkları Yükle
        run: npm install

      - name: 🔑 Ortam Değişkenleri (.env) Oluştur
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=https://nvzvttrjqbdsicmgjkiv.supabase.co" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_3zBX0x0tKfGl-mEZZRq5PA_Ien6vtNE" >> .env

      - name: 🛠️ Expo Android Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🔧 Kotlin Sürümünü 1.9.25 Olarak Zorla
        run: |
          echo "--- Prebuild sonrası Kotlin sürümü düzeltiliyor ---"
          sed -i "s/kotlinVersion = .*/kotlinVersion = '1.9.25'/" android/build.gradle
          echo "--- android/build.gradle kontrol ---"
          grep -n "kotlinVersion" android/build.gradle
          echo "--- android/gradle.properties'e ek ayar ---"
          echo "kotlin.version=1.9.25" >> android/gradle.properties

      - name: 🔑 Gradle Wrapper İzni Ver
        run: chmod +x android/gradlew

      - name: 🔨 Android APK Derle (Gradle)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📋 APK Dosyasını Hazırla
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/debug/app-debug.apk build_output/PoCo-v1.0.apk

      - name: 🚀 GitHub Release İle APK Yayınla
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/PoCo-v1.0.apk
          tag_name: v1.0.0
          name: PoCo Mobil Barkod & Kasa APK (v1.0.0)
          body: |
            🎉 **PoCo Android APK İndirme Bağlantısı**

            - **PoCo-v1.0.apk** dosyasını Android telefonunuza indirip doğrudan kurabilirsiniz.
            - Bu sürüm Supabase bulut veritabanına bağlıdır, çoklu cihaz realtime senkronizasyonludur ve offline çalışabilir.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
