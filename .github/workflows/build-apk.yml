name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repo Checkout
        uses: actions/checkout@v4

      - name: 🟢 Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Java 17 Kurulumu
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Bağımlılıkları Yükle
        run: npm install

      - name: 🔑 Ortam Değişkenleri (.env) Oluştur
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=https://nvzvttrjqbdsicmgjkiv.supabase.co" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_3zBX0x0tKfGl-mEZZRq5PA_Ien6vtNE" >> .env

      - name: 🛠️ Expo Android Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🔑 Gradle Wrapper İzni Ver
        run: chmod +x android/gradlew

      - name: 🔨 Android APK Derle (Gradle)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📋 APK Dosyasını Hazırla
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/debug/app-debug.apk build_output/PoCo-v1.0.apk

      - name: 🚀 GitHub Release İle APK Yayınla
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/PoCo-v1.0.apk
          tag_name: v1.0.0
          name: PoCo Mobil Barkod & Kasa APK (v1.0.0)
          body: |
            🎉 **PoCo Android APK İndirme Bağlantısı**

            - **PoCo-v1.0.apk** dosyasını Android telefonunuza indirip doğrudan kurabilirsiniz.
            - Bu sürüm Supabase bulut veritabanına bağlıdır, çoklu cihaz realtime senkronizasyonludur ve offline çalışabilir.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
