name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - pocoV2up
      - pocoV3
      - pocoV3up
      - 'v3*'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: 📥 Repo Checkout
        uses: actions/checkout@v4

      - name: 🟢 Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Java 17 Kurulumu
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Bağımlılıkları Yükle
        run: npm install --legacy-peer-deps

      - name: 🔑 Ortam Değişkenleri (.env) Oluştur
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=https://nvzvttrjqbdsicmgjkiv.supabase.co" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_3zBX0x0tKfGl-mEZZRq5PA_Ien6vtNE" >> .env

      - name: 🛠️ Expo Android Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🔑 Gradle Wrapper İzni Ver
        run: chmod +x android/gradlew

      - name: 🔨 Standalone Android APK Derle (Release)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📋 APK Dosyasını Hazırla
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/release/app-release.apk build_output/POCO-v3.0.apk

      - name: 📦 Actions Sayfasına APK'yı Yükle (Doğrudan İndirme)
        uses: actions/upload-artifact@v4
        with:
          name: POCO-v3.0-apk
          path: build_output/POCO-v3.0.apk

      - name: 🚀 GitHub Release İle APK Yayınla (v3.0.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== GitHub Release v3.0.0 Yayınlanıyor ==="
          gh release delete v3.0.0 --yes || true
          
          gh release create v3.0.0 build_output/POCO-v3.0.apk \
            --title "POCO Mobil Barkod & Kasa APK (v3.0.0)" \
            --notes "🎉 **POCO v3.0.0 Standalone Android APK İndirme Bağlantısı**

          ### 🚀 Bu Sürümdeki Yenilikler (POCO v3.0):
          - 👥 **Rol Tabanlı Yetkilendirme (RBAC):** Yönetici (Admin), Müdür ve Kasiyer rolleri.
          - 🔒 **Geliş Fiyatı & Kâr Marjı Gizleme:** Kasiyer rolüyle girildiğinde maliyet verileri tamamen gizlendi.
          - 📝 **Ürün Düzenleme & Güvenli Silme:** Ürün düzenleme modalı ve soft-delete silme koruması eklendi.
          - 🏷️ **Kategori & Marka Desteği:** Esnek ürün şeması (sadece Ad ve Satış Fiyatı zorunlu, diğerleri opsiyonel) ve kategori filtre çipleri.
          - 🛒 **Kasada Hızlı / Manuel Tutar:** Sistemde olmayan ürünler için kasaya anında tutar girme (+ Manuel Tutar) butonu.
          - 🎯 **Barkod Odaklama (ROI):** Barkod okuyucu kamera sadece ortadaki yeşil hedef kutusu içindeki barkodları okur.
          - 🖼️ **Görsel Desteği & Supabase Migration:** Storage izinleri ve görsel render fallback'leri güçlendirildi."
