name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: 📥 Repo Checkout
        uses: actions/checkout@v4

      - name: 🟢 Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Java 17 Kurulumu
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Bağımlılıkları Yükle
        run: npm install

      - name: 🔑 Ortam Değişkenleri (.env) Oluştur
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=https://nvzvttrjqbdsicmgjkiv.supabase.co" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_3zBX0x0tKfGl-mEZZRq5PA_Ien6vtNE" >> .env

      - name: 🛠️ Expo Android Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🔧 Kotlin 1.9.24 → 1.9.25 Zorla (Compose Compiler Uyumluluğu)
        run: |
          echo "=== FIX 1: React Native version catalog'unda Kotlin sürümünü değiştir ==="
          TOML_FILE="node_modules/react-native/gradle/libs.versions.toml"
          echo "Önce:"
          grep 'kotlin = ' "$TOML_FILE"
          sed -i 's/kotlin = "1.9.24"/kotlin = "1.9.25"/' "$TOML_FILE"
          echo "Sonra:"
          grep 'kotlin = ' "$TOML_FILE"

          echo "=== FIX 2: android/build.gradle'da classpath'e sürüm ekle ==="
          sed -i "s|classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')|classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25')|" android/build.gradle
          grep 'kotlin-gradle-plugin' android/build.gradle

          echo "=== FIX 3: gradle.properties'e yedek ayar ==="
          echo "kotlin.version=1.9.25" >> android/gradle.properties
          echo "android.kotlinVersion=1.9.25" >> android/gradle.properties

          echo "=== Tüm düzeltmeler uygulandı ==="

      - name: 🔑 Gradle Wrapper İzni Ver
        run: chmod +x android/gradlew

      - name: 🔨 Standalone Android APK Derle (Release)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📋 APK Dosyasını Hazırla
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/release/app-release.apk build_output/POCO-v1.0.apk

      - name: 🚀 GitHub Release İle APK Yayınla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== GitHub Release Yayınlanıyor / Güncelleniyor ==="
          
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "Release mevcut, eski asset silinip güncelleniyor..."
            gh release delete-asset v1.0.0 POCO-v1.0.apk --yes || true
            gh release upload v1.0.0 build_output/POCO-v1.0.apk
          else
            echo "Release bulunamadı, yeni oluşturuluyor..."
            gh release create v1.0.0 build_output/POCO-v1.0.apk \
              --title "POCO Mobil Barkod & Kasa APK (v1.0.0)" \
              --notes "🎉 **POCO Standalone Android APK İndirme Bağlantısı**

          - **POCO-v1.0.apk** dosyasını Android telefonunuza indirip doğrudan kurabilirsiniz.
          - Bu sürüm bağımsız (Release) olarak derlenmiştir, geliştirici sunucusuna ihtiyaç duymaz.
          - Supabase bulut veritabanı, çoklu cihaz realtime senkronizasyonu ve offline çalışma desteği mevcuttur."
          fi
