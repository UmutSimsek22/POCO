name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - pocoV2up
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: 📥 Repo Checkout
        uses: actions/checkout@v4

      - name: 🟢 Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Java 17 Kurulumu
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Bağımlılıkları Yükle
        run: npm install --legacy-peer-deps

      - name: 🔑 Ortam Değişkenleri (.env) Oluştur
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=https://nvzvttrjqbdsicmgjkiv.supabase.co" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_3zBX0x0tKfGl-mEZZRq5PA_Ien6vtNE" >> .env

      - name: 🛠️ Expo Android Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🔑 Gradle Wrapper İzni Ver
        run: chmod +x android/gradlew

      - name: 🔨 Standalone Android APK Derle (Release)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📋 APK Dosyasını Hazırla
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/release/app-release.apk build_output/POCO-v2.0.apk

      - name: 📦 Actions Sayfasına APK'yı Yükle (Doğrudan İndirme)
        uses: actions/upload-artifact@v4
        with:
          name: POCO-v2.0-apk
          path: build_output/POCO-v2.0.apk

      - name: 🚀 GitHub Release İle APK Yayınla (v2.0.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== GitHub Release v2.0.0 Yayınlanıyor ==="
          gh release delete v2.0.0 --yes || true
          
          gh release create v2.0.0 build_output/POCO-v2.0.apk \
            --title "POCO Mobil Barkod & Kasa APK (v2.0.0)" \
            --notes "🎉 **POCO v2.0.0 Standalone Android APK İndirme Bağlantısı**

          ### 🚀 Bu Sürümdeki Yenilikler (POCO v2):
          - 🖼️ **Tüm İkonlar Yenilendi:** Geri oku, çıkış, büyüteç, artı, kasa ve QR kod simgeleri net ve renkli hale getirildi.
          - 📱 **Ekran Taşıntısı Düzeltildi:** Durum çubuğu (Status Bar / Çentik) güvenli alan boşluğu eklendi, butonlar 44x44px geniş dokunmatik kartlara yükseltildi.
          - 🔍 **Ürün Detay Modalı Kapanma Deneyimi:** Sorgulama kartının altına büyük **'Tamam / Listeye Dön'** butonu ve arka plana dokunarak kapatma eklendi.
          - 📸 **Kamera İle Ürün Fotoğrafı Çekme:** Ürün eklerken doğrudan kameradan 1:1 fotoğraf çekme özelliği aktif edildi.
          - ⚡ **Hızlı Kamera Kısayolu:** Ana ekrana doğrudan barkod tarayıcıyı açan hızlı kamera butonu eklendi."
